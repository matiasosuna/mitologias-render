# Cola ÚNICA de publicación en la nube (repo público mitologias-render: minutos gratis), para que la Mac pueda estar cerrada.
# Una sola lista ordenada (scripts/cola.mjs → cola-unificada.json en la rama estado) y el MISMO calendario para las tres:
#   turnos cada 4 h; 08 HST = episodio, 12 y 20 HST = "Who is…?" (a las tres juntas), 00/04/16 HST = solo para alcanzar.
#   Episodio: YouTube horizontal · Instagram todas sus partes · TikTok (Buffer) un vertical completo. "Who is…?" = Short en las tres.
#   Mientras una plataforma esté atrasada, la que va adelante no publica episodios y las atrasadas publican hasta 4 por turno.
#   Parejas: por día 1 episodio + 2 "Who is…?" en las tres.
# Cada plataforma se hace una vez por turno (out/turnos.json en el estado); el disparador de Cloudflare corre cada hora y
# un turno que falló se reintenta a la hora siguiente. Si un paso falla, el job termina en rojo.
# Estado (registros + cola): rama "estado" (scripts/estado-*.sh). Videos: release "media" (scripts/nube.mjs);
# si falta alguno, se renderiza en la misma corrida. En el repo privado NO corre (sus minutos se pagan).
# A mano: gh workflow run publicar -R matiasosuna/mitologias-render
# Desde 2026-11-27 también YouTube (el mismo horizontal, desde el E1; lo de antes quedó privado). Desde 2026-11-24 (Matías: solo Instagram, horizontal): publica Instagram, el episodio horizontal 16:9, uno de cada serie en
# su turno (cola.mjs SERIE_HST) y solo si su guion tiene "claridad": true. El paso de TikTok queda con if: false.
# Instagram desde cero (una vez): gh workflow run publicar -R matiasosuna/mitologias-render -f reiniciar_ig=true
name: publicar
on:
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *' # 16, 20, 00, 04, 08 y 12 HST
    # GitHub a veces saltea corridas programadas: además corre cada hora; el turno se calcula como el último
    # de la lista (turnoUTC) y lo ya hecho en el turno no se repite, así un turno salteado se recupera a la hora siguiente.
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      turno:
        description: 'Fecha ISO del turno a correr ya (p. ej. el de episodio, 18 UTC); vacío = el de ahora'
        required: false
      reiniciar_ig:
        description: 'Instagram desde cero: registro a [] (respaldo + borrados.json, scripts/instagram-reiniciar.mjs)'
        type: boolean
        default: false
concurrency:
  group: publicar
  cancel-in-progress: false
permissions:
  contents: write
  actions: read # artefactos de render-nube y hora de creación de la corrida
jobs:
  publicar:
    if: github.repository == 'matiasosuna/mitologias-render'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NUBE: '1'
      IG_VIA: graph # Instagram solo por la API de Meta, nunca Buffer (Matías 2026-10-22)
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: for i in 1 2 3; do timeout 300 sudo apt-get update -q && timeout 600 sudo apt-get install -o DPkg::Lock::Timeout=60 -y -q libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 fonts-noto-core ffmpeg && exit 0; echo "apt intento $i colgado"; done; exit 1 # un mirror colgado trababa la cola 40+ min (2026-10-23)
      - run: npx remotion browser ensure
      - name: claves (.env y .yt-token.json desde los secretos; nunca se imprimen)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          MOC_PAGE_TOKEN: ${{ secrets.MOC_PAGE_TOKEN }}
          MOC_IG_USER_ID: ${{ secrets.MOC_IG_USER_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
            const fs = require("fs"), e = process.env;
            const k = ["MOC_PAGE_TOKEN", "MOC_IG_USER_ID"]; // 2026-11-24: solo Instagram (API de Meta); YouTube y Buffer, opcionales
            const faltan = k.filter((x) => !e[x]);
            if (faltan.length) { console.error("faltan secretos: " + faltan.join(", ")); process.exit(1); }
            for (const x of ["YT_CLIENT_ID", "YT_CLIENT_SECRET", "BUFFER_API_KEY", "GEMINI_API_KEY"]) if (e[x]) k.push(x);
            fs.writeFileSync(".env", k.map((x) => x + "=" + e[x].trim()).join("\n") + "\n", { mode: 0o600 });
            if (e.YT_TOKEN_JSON) {
              const t = JSON.parse(e.YT_TOKEN_JSON);
              for (const v of [t.refresh_token, t.access_token]) if (v) console.log("::add-mask::" + v);
              fs.writeFileSync(".yt-token.json", JSON.stringify({ ...t, vence: 0 }), { mode: 0o600 }); // se renueva en la corrida
            }
          '
      - name: turno (hora de creación de la corrida, aunque haya esperado en la cola; o el pedido a mano)
        env:
          TURNO_PEDIDO: ${{ inputs.turno }}
        run: |
          echo "TURNO_FECHA=${TURNO_PEDIDO:-$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .created_at)}" >> "$GITHUB_ENV"
      - name: git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      # sin estado no se publica nada (los pasos de abajo solo corren si todo lo anterior salió bien)
      - name: traer estado
        run: scripts/estado-traer.sh

      # una sola vez, a mano (input reiniciar_ig): los Reels de antes salen del registro (respaldo como artefacto y en la
      # historia de la rama estado); después la corrida sigue normal, con Instagram desde el E1 de cada serie
      - name: Instagram desde cero
        if: inputs.reiniciar_ig
        run: node scripts/instagram-reiniciar.mjs && scripts/estado-subir.sh
      - name: respaldo del registro de Instagram
        if: inputs.reiniciar_ig
        uses: actions/upload-artifact@v4
        with:
          name: subidas-instagram-respaldo
          path: out/subidas-instagram-*-borrados.json
          retention-days: 90

      - name: cola única (suma lo nuevo al final)
        run: node scripts/nube.mjs cola && node scripts/nube.mjs plan

      # cada paso con continue-on-error: si falla uno, los demás siguen; "resultado" pone el job en rojo
      # YouTube vuelve (Matías 2026-11-27), desde el E1 de cada serie (cola.mjs YT_DESDE); TikTok sigue parado (if: false)
      - name: YouTube
        id: yt
        continue-on-error: true
        run: node scripts/nube.mjs turno youtube
      - name: guardar estado
        id: e1
        continue-on-error: true
        run: scripts/estado-subir.sh

      - name: Instagram
        id: ig
        continue-on-error: true
        run: node scripts/nube.mjs turno instagram
      - name: guardar estado
        id: e2
        continue-on-error: true
        run: scripts/estado-subir.sh

      - name: TikTok (Buffer)
        id: tk
        if: false
        continue-on-error: true
        run: node scripts/nube.mjs turno tiktok
      - name: guardar estado
        id: e3
        if: false
        continue-on-error: true
        run: scripts/estado-subir.sh

      - name: adelantar renders de los próximos turnos (horizontal de Instagram)
        continue-on-error: true
        run: node scripts/nube.mjs adelantar

      # con YouTube y TikTok parados casi no borra: pide que las 3 redes lo tengan, así nunca saca un horizontal que IG necesita
      - name: borrar del release lo ya publicado en las 3 redes (hace 3+ días)
        continue-on-error: true
        run: node scripts/limpiar-media.mjs --borrar

      - name: resultado
        if: always()
        run: |
          echo "youtube=${{ steps.yt.outcome }} instagram=${{ steps.ig.outcome }} tiktok=${{ steps.tk.outcome }} estado=${{ steps.e1.outcome }}/${{ steps.e2.outcome }}/${{ steps.e3.outcome }}"
          for o in "${{ steps.yt.outcome }}" "${{ steps.ig.outcome }}" "${{ steps.tk.outcome }}" "${{ steps.e1.outcome }}" "${{ steps.e2.outcome }}" "${{ steps.e3.outcome }}"; do
            [ "$o" = success ] || [ "$o" = skipped ] || exit 1 # skipped = YouTube/TikTok parados (2026-11-24)
          done
