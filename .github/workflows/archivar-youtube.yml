# Pasa a privado todos los videos del canal de YouTube (Matías 2026-11-21: «archivá todos y arranquemos de nuevo»).
# Solo a mano. Con listar=true solo muestra qué cambiaría.
name: archivar-youtube
on:
  workflow_dispatch:
    inputs:
      listar:
        description: 'solo listar (true/false)'
        default: 'false'
permissions:
  contents: read
jobs:
  privado:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: claves (nunca se imprimen)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          node -e '
            const fs = require("fs"), e = process.env;
            fs.writeFileSync(".env", ["YT_CLIENT_ID", "YT_CLIENT_SECRET"].map((x) => x + "=" + e[x].trim()).join("\n") + "\n", { mode: 0o600 });
            const t = JSON.parse(e.YT_TOKEN_JSON);
            for (const v of [t.refresh_token, t.access_token]) if (v) console.log("::add-mask::" + v);
            fs.writeFileSync(".yt-token.json", JSON.stringify({ ...t, vence: 0 }), { mode: 0o600 });
          '
      - run: node scripts/youtube-privado.mjs ${{ inputs.listar == 'true' && '--listar' || '' }}
