# Render en la nube (GitHub Actions, repo público mitologias-render): versiones verticales de episodios, uno por máquina, en paralelo.
# Se dispara con: gh workflow run render.yml -f ids='["hawaianas-01-...","hawaianas-02-..."]' -f tipo=vertical
name: render-nube
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Lista JSON de ids'
        required: true
      tipo:
        description: 'vertical | horizontal | short | partes'
        default: vertical
      release:
        description: 'true = además sube el resultado al release media (horizontal, vertical→TikTok, partes); lo usa prerender'
        default: 'false'
permissions:
  contents: write # release media
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJSON(inputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: for i in 1 2 3; do timeout 300 sudo apt-get update -q && timeout 600 sudo apt-get install -o DPkg::Lock::Timeout=60 -y -q libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 fonts-noto-core ffmpeg && exit 0; echo "apt intento $i colgado"; done; exit 1 # un mirror colgado trababa la cola 40+ min (2026-10-23)
      - run: npx remotion browser ensure
      - name: render
        run: |
          case "${{ inputs.tipo }}" in
            vertical) node scripts/vertical-render.mjs ${{ matrix.id }} ;;
            short) node scripts/short-render.mjs ${{ matrix.id }} ;;
            partes) node scripts/vertical-partes.mjs ${{ matrix.id }} ;;
            *) node scripts/motor-render.mjs ${{ matrix.id }} --imagen=en --audio=en && node scripts/miniaturas.mjs ${{ matrix.id }} ;;
          esac
      - name: subir al release media (prerender)
        if: inputs.release == 'true' && inputs.tipo != 'short'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ inputs.tipo }}" in vertical) M=vertical ;; partes) M=partes ;; *) M=horizontal ;; esac
          node scripts/prerender.mjs subir ${{ matrix.id }}:$M
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-${{ inputs.tipo }}
          path: |
            out/${{ matrix.id }}/*.mp4
            out/${{ matrix.id }}/*.srt
            out/${{ matrix.id }}/miniatura.jpg
            out/${{ matrix.id }}/partes.json
          retention-days: 7
