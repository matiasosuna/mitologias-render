# Pre-render de lo próximo de la cola única (solo renderiza vía render-nube; NO publica, no toca Buffer).
# Elige los próximos n ítems a los que les falta archivo en el release "media" (y sin artefacto vigente de render-nube).
# gh workflow run prerender.yml -R matiasosuna/mitologias-render [-f n=6]
name: prerender
on:
  workflow_dispatch:
    inputs:
      n:
        description: 'cuántos ítems pendientes renderizar'
        default: '6'
permissions:
  contents: read
  actions: write # dispara render-nube
concurrency:
  group: prerender
  cancel-in-progress: false
jobs:
  prerender:
    if: github.repository == 'matiasosuna/mitologias-render'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: traer estado
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          scripts/estado-traer.sh
      - name: plan y render-nube
        run: |
          node scripts/prerender.mjs plan --n=${{ inputs.n }} --motor=github | tee plan.txt
          LOTES=$(grep -o '^lotes=.*' "$GITHUB_OUTPUT" | cut -d= -f2-)
          echo "$LOTES" | node -e 'for (const l of JSON.parse(require("fs").readFileSync(0,"utf8"))) console.log(l.tipo + " " + JSON.stringify(l.ids))' | while read -r TIPO IDS; do
            gh workflow run render.yml -f ids="$IDS" -f tipo="$TIPO" && echo "render-nube disparado: $TIPO $IDS"
          done
