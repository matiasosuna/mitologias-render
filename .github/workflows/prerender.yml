# Pre-render de lo próximo de la cola única (solo renderiza; NO publica, no toca Buffer).
# Los episodios se renderizan en MODAL (un contenedor por episodio y formato, en paralelo): horizontal (YouTube),
# vertical completo (TikTok) y partes (Instagram). Los resultados quedan en el release "media". Si Modal falla (o no hay claves),
# esos formatos se mandan a render-nube (GitHub). Los Shorts van por render-nube.
# Elige los próximos ítems de la cola con archivos faltantes en el release, saltando episodios cuyo guion usa personajes viejos
# (sin _oficial; se listan en el log) y respetando episodios/presupuesto.
# CRON (cada 3 h, modo ventana): simula los próximos 12 turnos (2 días) de las tres redes y renderiza lo que falte, de a poco
# (máx. 6 renders por corrida, solo si no hay otro render-nube en curso): en GitHub (gratis); en Modal solo lo que se necesita en < 6 h
# o si el último render-nube falló. Solo Griegas, Nórdicas, Egipcias y Hawaianas (las demás tienen claves sin diseño oficial). Nunca publica.
# gh workflow run prerender.yml -R matiasosuna/mitologias-render [-f episodios=8] [-f presupuesto=4] [-f forzar=id,id] [-f motor=modal|github]
name: prerender
on:
  schedule:
    - cron: '17 */3 * * *' # cada 3 h: mantiene renderizados los próximos 2 días de turnos (modo ventana)
  workflow_dispatch:
    inputs:
      episodios:
        description: 'máximo de episodios a renderizar'
        default: '8'
      presupuesto:
        description: 'tope estimado en USD (Modal)'
        default: '4'
      forzar:
        description: 'ids a re-renderizar aunque ya estén en el release (ignoran el filtro de personajes viejos)'
        default: ''
      motor:
        description: 'modal | github'
        default: modal
      series:
        description: 'solo estas mitologías (ej. griegas,nordicas,egipcias,hawaianas); vacío = todas'
        default: ''
      reusar:
        description: 'true = no renderizar: bajar de Modal (Volume moc-out) lo que dejó una corrida anterior y subirlo al release'
        default: 'false'
      modo:
        description: 'cola = próximos de la cola (lote manual) | ventana = lo que piden los próximos turnos (el cron usa este)'
        default: cola
      simular:
        description: 'true = solo mostrar el plan, costo estimado y omitidos (no renderiza)'
        default: 'false'
permissions:
  contents: write # release media
  actions: write  # dispara render-nube
concurrency:
  group: prerender
  cancel-in-progress: false
jobs:
  prerender:
    if: github.repository == 'matiasosuna/mitologias-render'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: traer estado
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          scripts/estado-traer.sh
      - name: plan
        run: |
          MODAL=0; [ -n "$MODAL_TOKEN_ID" ] && MODAL=1
          MODO="${{ inputs.modo || 'ventana' }}"
          if [ "$MODO" = ventana ]; then
            SERIES="${{ inputs.series || 'griegas,nordicas,egipcias,hawaianas' }}"; N=6; PRES="${{ inputs.presupuesto || '1' }}"; MOTOR="${{ inputs.motor || 'ventana' }}"
            # GitHub viene fallando si alguno de los últimos 4 render-nube terminados falló (entonces lo no urgente también va a Modal)
            FALLA=0; gh run list -w render.yml -L 4 --json conclusion -q '.[].conclusion' | grep -qx failure && FALLA=1
            # ritmo gradual: si hay render-nube en curso, no se suma más trabajo en GitHub
            EN_CURSO=$(gh run list -w render.yml -L 20 --json status -q '[.[]|select(.status!="completed")]|length')
            echo "EN_CURSO=$EN_CURSO" >> "$GITHUB_ENV"
            node scripts/prerender.mjs plan --modo=ventana --n=$N --presupuesto=$PRES --series=$SERIES --motor=$MOTOR --modal=$MODAL --githubfalla=$FALLA
          else
            echo "EN_CURSO=0" >> "$GITHUB_ENV"
            node scripts/prerender.mjs plan --n=99 --episodios=${{ inputs.episodios }} --presupuesto=${{ inputs.presupuesto }} --forzar=${{ inputs.forzar }} --series=${{ inputs.series }} --motor=${{ inputs.motor }} --modal=$MODAL
          fi
      - name: lotes de GitHub (render-nube)
        if: inputs.simular != 'true'
        run: |
          node -e 'for (const l of JSON.parse(require("fs").readFileSync("out/lotes.json","utf8"))) if (l.motor === "github") console.log(l.tipo + " " + JSON.stringify(l.ids))' | while read -r TIPO IDS; do
            [ "${EN_CURSO:-0}" = 0 ] || { echo "hay render-nube en curso: se espera ($TIPO $IDS)"; continue; }
            gh workflow run render.yml -f ids="$IDS" -f tipo="$TIPO" -f release=true && echo "render-nube disparado: $TIPO $IDS"
          done
      - name: episodios en Modal → release media
        id: m
        if: inputs.simular != 'true'
        continue-on-error: true
        run: |
          ITEMS=$(node -e 'const l=JSON.parse(require("fs").readFileSync("out/lotes.json","utf8")).filter(x=>x.motor==="modal"); console.log(l.flatMap(x=>x.ids.map(i=>i+":"+x.tipo)).join(" "))')
          [ -n "$ITEMS" ] || { echo "nada para Modal"; exit 0; }
          echo "items=$ITEMS" >> "$GITHUB_OUTPUT"
          pip install -q modal
          sudo apt-get install -y ffmpeg >/dev/null # armado del mp4 de TikTok (tapa + vertical)
          START=$(date +%s)
          if [ "${{ inputs.reusar }}" = true ]; then rc=0; echo '[]' > out/modal-fallos.json; else rc=0; MOC_ITEMS="$ITEMS" timeout 6000 modal run scripts/modal_render.py || rc=$?; fi
          echo "Modal: $(( $(date +%s) - START )) s (rc=$rc)"
          FALLOS=$(cat out/modal-fallos.json 2>/dev/null | node -e 'try{console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).join(" "))}catch{console.log("TODOS")}')
          [ "$FALLOS" = TODOS ] && FALLOS="$ITEMS"
          echo "fallos=$FALLOS" >> "$GITHUB_OUTPUT"
          OK=""; for it in $ITEMS; do case " $FALLOS " in *" $it "*) ;; *) OK="$OK $it";; esac; done
          for id in $(echo "$OK" | tr ' ' '\n' | cut -d: -f1 | sort -u); do modal volume get --force moc-out "$id" out/; done
          node scripts/prerender.mjs subir $OK
          [ -z "$FALLOS" ] || exit 1
      - name: respaldo en render-nube de lo que falló en Modal
        if: inputs.simular != 'true' && steps.m.outcome == 'failure' && steps.m.outputs.items != ''
        run: |
          F="${{ steps.m.outputs.fallos }}"; [ -n "$F" ] || F="${{ steps.m.outputs.items }}"
          for T in horizontal vertical partes; do
            IDS=$(echo "$F" | tr ' ' '\n' | grep ":$T\$" | cut -d: -f1 | node -e 'const a=require("fs").readFileSync(0,"utf8").split("\n").filter(Boolean); if (a.length) console.log(JSON.stringify(a))')
            [ -z "$IDS" ] || gh workflow run render.yml -f ids="$IDS" -f tipo="$T" -f release=true
          done
