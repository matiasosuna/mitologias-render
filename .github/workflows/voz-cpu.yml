# Voz (Chatterbox Turbo) en la CPU de GitHub: gratis en el repo público, sin Modal. Lo usa scripts/voz-github.mjs
# (motor-narrar, por defecto). Dos entradas: workflow_dispatch (con gh) o un pedido pedidos/<clave>.json empujado a la rama
# "voz" (sin gh: la rutina de la nube). Salida: artefactos voz-<clave>-<n> y el zip voz-<clave>.zip en el release "voz".
# MOTOR (variable del repo VOZ_MOTOR): modal = GPU de Modal, cuenta "familia" (secretos MODAL_TOKEN_*; Matías 2026-10-25, tope USD 30/mes)
# | cpu = CPU de GitHub (gratis, más lento; queda apagado de respaldo).
# La muestra de voz va cifrada (lib/voz-ref.enc, AES-256, clave en el secreto VOZ_CLAVE): nunca en claro en este repo.
name: voz-cpu
run-name: voz ${{ inputs.clave || 'pedido' }}
on:
  workflow_dispatch:
    inputs:
      clave: { description: 'id único de la tanda (lo pone voz-github.mjs)', required: true }
      frases: { description: 'JSON [{h, texto}] en gzip+base64', required: true }
  push:
    branches: [voz]
    paths: ['pedidos/**']
permissions:
  contents: write # release "voz"
env:
  PARTES: 6
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.p.outputs.matriz }}
      claves: ${{ steps.p.outputs.claves }}
      motor: ${{ vars.VOZ_MOTOR == 'modal' && 'modal' || 'cpu' }}
    steps:
      - uses: actions/checkout@v4 # la rama "voz" = main + un solo commit con el pedido (voz-github.mjs la pisa cada vez)
        if: github.event_name == 'push'
      - id: p
        env:
          CLAVE: ${{ inputs.clave }}
          FRASES: ${{ inputs.frases }}
        run: |
          mkdir -p "$RUNNER_TEMP/pedidos"
          if [ -n "$CLAVE" ]; then printf '%s' "$FRASES" | base64 -d | gunzip > "$RUNNER_TEMP/pedidos/$CLAVE.json"
          else
            for f in $(git ls-files 'pedidos/*.json'); do cp "$f" "$RUNNER_TEMP/pedidos/"; done
          fi
          CLAVES=$(ls "$RUNNER_TEMP/pedidos" | sed 's/\.json$//' | node -e 'console.log(JSON.stringify(require("fs").readFileSync(0,"utf8").split("\n").filter(Boolean)))')
          echo "claves=$CLAVES" >> "$GITHUB_OUTPUT"
          echo "matriz=$(node -e 'const c=JSON.parse(process.argv[1]); console.log(JSON.stringify(c.flatMap((clave)=>Array.from({length:+process.env.PARTES},(_,parte)=>({clave,parte})))))' "$CLAVES")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pedidos-${{ github.run_id }}
          path: ${{ runner.temp }}/pedidos/*.json
          retention-days: 1
  voz-modal:
    needs: plan
    if: needs.plan.outputs.claves != '[]' && needs.plan.outputs.motor == 'modal'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        clave: ${{ fromJSON(needs.plan.outputs.claves) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/modal_voz.py
            lib/voz-ref.enc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: pedidos-${{ github.run_id }}
          path: pedidos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q modal
      - name: narrar en Modal (familia)
        env:
          VOZ_CLAVE: ${{ secrets.VOZ_CLAVE }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOZ_CLAVE -in lib/voz-ref.enc -out lib/voz-matias-ref.wav # modal_voz.py la monta si existe
          VOZ_ENTRADA="pedidos/${{ matrix.clave }}.json" VOZ_SALIDA=salida timeout 1800 modal run scripts/modal_voz.py
          rm -f lib/voz-matias-ref.wav
      - uses: actions/upload-artifact@v4
        with:
          name: voz-${{ matrix.clave }}-0
          path: salida/*.wav
          retention-days: 3
  voz:
    needs: plan
    if: needs.plan.outputs.claves != '[]' && needs.plan.outputs.motor == 'cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/voz_cpu.py
            lib/voz-ref.enc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: pedidos-${{ github.run_id }}
          path: pedidos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: chatterbox-cpu-v1
      - name: instalar Chatterbox (torch CPU)
        run: for i in 1 2 3; do timeout 900 pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts && exit 0; done; exit 1
      - name: narrar
        env:
          VOZ_CLAVE: ${{ secrets.VOZ_CLAVE }}
          PARTE: ${{ matrix.parte }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOZ_CLAVE -in lib/voz-ref.enc -out "$RUNNER_TEMP/ref.wav"
          VOZ_ENTRADA="pedidos/${{ matrix.clave }}.json" VOZ_SALIDA=salida VOZ_REF="$RUNNER_TEMP/ref.wav" python scripts/voz_cpu.py
          rm -f "$RUNNER_TEMP/ref.wav"
      - uses: actions/upload-artifact@v4
        with:
          name: voz-${{ matrix.clave }}-${{ matrix.parte }}
          path: salida/*.wav
          if-no-files-found: ignore
          retention-days: 3
  juntar:
    needs: [plan, voz, voz-modal]
    if: ${{ !cancelled() && needs.plan.outputs.claves != '[]' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: voz-*
          path: a
      - name: zip por tanda → release "voz"
        run: |
          gh release view voz -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create voz -R "$GITHUB_REPOSITORY" --title voz --notes "Narraciones de voz-cpu (temporales)" --prerelease
          for c in $(echo '${{ needs.plan.outputs.claves }}' | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8")).forEach((c)=>console.log(c))'); do
            mkdir -p "z/$c"; cp a/voz-$c-*/*.wav "z/$c/" 2>/dev/null || true
            (cd "z/$c" && zip -q -r "../../voz-$c.zip" .)
            gh release upload voz "voz-$c.zip" -R "$GITHUB_REPOSITORY" --clobber
          done
          # limpieza: zips de más de 3 días
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/voz" -q '.assets[] | select((now - (.created_at | fromdate)) > 259200) | .name' | while read -r n; do gh release delete-asset voz "$n" -R "$GITHUB_REPOSITORY" -y; done
