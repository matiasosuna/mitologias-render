# Learn Bible 777: narra (workflow voz-cpu → Chatterbox en GPU de Modal) y renderiza en Modal (horizontal + vertical) capítulos
# de la serie biblia. Modal = cuenta "familia" (secretos MODAL_TOKEN_*), tope USD 30/mes: si el mes pasa USD 29, no renderiza.
# Respaldo gratis 100% GitHub: biblia-github.yml (apagado).
# Resultado → release "biblia" (mp4, srt, miniatura.jpg + audio/timeline en zip, con el id adelante). NUNCA publica en redes.
# gh workflow run biblia.yml -R matiasosuna/mitologias-render -f ids="biblia-genesis-01 biblia-genesis-02"
name: biblia
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'ids separados por espacio (ej. biblia-genesis-01 biblia-genesis-02)'
        required: true
permissions:
  contents: write # release biblia
  actions: write # dispara voz-cpu y baja sus artefactos
concurrency:
  group: biblia
  cancel-in-progress: false
jobs:
  biblia:
    if: github.repository == 'matiasosuna/mitologias-render'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      IDS: ${{ inputs.ids }}
      VOZ_EN: chatterbox
      VOZ_MOTOR: github
      VOZ_TRANSPORTE: gh
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: validar ids
        run: |
          for id in $IDS; do
            case "$id" in biblia-*) ;; *) echo "::error::$id no es de la serie biblia"; exit 1 ;; esac
            [ -f "src/videos/$id/guion.json" ] || { echo "::error::falta src/videos/$id/guion.json"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q modal && sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: tope de gasto (familia, USD 29)
        run: |
          G=$(python scripts/modal-gasto.py); echo "Modal este mes: USD $G"
          python -c "import sys; sys.exit(float('$G') >= 29)" || { echo "::error::Modal pasó USD 29 este mes: no se renderiza (tarjeta de la mamá de Matías)"; exit 1; }
      # audios ya narrados en corridas anteriores (el motor solo narra las frases que faltan)
      - uses: actions/cache@v4
        with:
          path: public/audio/biblia-*
          key: biblia-voz-${{ github.run_id }}
          restore-keys: biblia-voz-
      - name: narrar (Chatterbox en la CPU de GitHub, voz-cpu)
        run: for id in $IDS; do node scripts/motor-narrar.mjs "$id" en; done
      - name: render (Modal, horizontal + vertical)
        run: |
          ITEMS=$(for id in $IDS; do printf '%s:horizontal %s:vertical ' "$id" "$id"; done)
          rc=0; MOC_ITEMS="$ITEMS" timeout 9000 modal run scripts/modal_render.py || rc=$?
          echo "RC_RENDER=$rc" >> "$GITHUB_ENV"
          for id in $IDS; do modal volume get --force moc-out "$id" out/ || echo "::error::$id: nada en moc-out"; done
      - name: subir al release biblia
        run: |
          gh release view biblia >/dev/null 2>&1 || gh release create biblia --title "Learn Bible 777" --notes "Renders de la serie biblia (workflow biblia.yml). No se publica nada en redes desde acá."
          mkdir -p subir
          for id in $IDS; do
            for f in out/$id/*.mp4 out/$id/*.srt out/$id/miniatura.jpg out/$id/portada-ig*.jpg; do
              [ -f "$f" ] || continue
              n=$(basename "$f"); case "$n" in "$id".*) ;; *) n="$id.$n" ;; esac
              cp "$f" "subir/$n"
            done
            zip -qr "subir/$id.voz.zip" "public/audio/$id" "src/videos/$id/timeline.json" # para traerlo al repo privado
          done
          ls -la subir
          [ -n "$(ls subir)" ] && gh release upload biblia subir/* --clobber
          [ "$RC_RENDER" = 0 ] || { echo "::error::falló algún render en Modal (ver log del paso render)"; exit 1; }
